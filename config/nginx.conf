events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Upstream: Frontend (React/Vite build) ──
    upstream frontend_server {
        server frontend:80;
    }

    # ── Upstream: Backend (Spring Boot) ──
    upstream backend_server {
        server backend:8080;
    }

    # ── Serwer główny: Frontend ──────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Frontend — React SPA
        location / {
            proxy_pass http://frontend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Ważne dla React Router — fallback do index.html
            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }

        # Backend API — oddzielna ścieżka na tym samym porcie
        location /api/ {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # Actuator — tylko health dostępny z zewnątrz
        location /actuator/health {
            proxy_pass http://backend_server/actuator/health;
        }

        # Prometheus endpoint — zablokowany z zewnątrz
        location /actuator/prometheus {
            deny all;
            return 403;
        }
    }
}