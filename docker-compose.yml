version: '3.8'

networks:
  app-net:
    driver: bridge
  monitoring-net:
    driver: bridge

volumes:
  postgres-data:
  grafana-data:
  loki-data:
  prometheus-data:

services:

  # ─────────────── POSTGRES ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sma-postgres
    environment:
      POSTGRES_DB: sma
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME} -d sma"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────── BACKEND ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: sma-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sma
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      PLATFORM_URL: ${PLATFORM_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      loki:
        condition: service_started
    networks:
      - app-net
      - monitoring-net
    expose:
      - "8080"

  # ─────────────── FRONTEND ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend/react
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost
    container_name: sma-frontend
    networks:
      - app-net
    expose:
      - "80"

  # ─────────────── NGINX ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: sma-nginx
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-net

  # ─────────────── LOKI ───────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: sma-loki
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yml
    networks:
      - monitoring-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─────────────── PROMETHEUS ─────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: sma-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - monitoring-net
      - app-net

  # ─────────────── GRAFANA ────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: sma-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      # Wyłącz rejestrację — nie potrzebna
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring-net